name: CI

# Layers 1-2 (contracts/testing-strategy.md, ADR 0024): unit + contract tests on every push and PR.
# Branch protection on main requires every job here to pass before merge. No coverage threshold.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            client/pyproject.toml
      - uses: azure/setup-helm@v4 # tests/contract renders the chart with `helm template`
      - name: Install
        run: pip install -e client -e ".[dev]"
      - name: Lint
        run: ruff check src client tests
      - name: Unit and contract tests
        env:
          # A missing helm must FAIL the build, never silently skip the contract tests green.
          BOOTH_TEST_REQUIRE_HELM: "1"
        run: pytest tests/unit tests/contract
      - name: helm lint
        run: helm lint charts/booth-lakehouse --set identity.oidcIssuerUrl=http://issuer.example

  image:
    # Catches a broken Dockerfile on the PR that breaks it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t booth-lakehouse:ci .
      - name: The image runs the API and ships the client library
        run: docker run --rm --entrypoint python booth-lakehouse:ci -c "import booth_lakehouse_server.app, booth_lakehouse, pyiceberg, pyarrow"

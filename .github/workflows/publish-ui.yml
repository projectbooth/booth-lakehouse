name: Publish UI package

# ADR 0030/0093: booth-design consumes @projectbooth/lakehouse-ui as an ordinary npm dependency
# (exact-pinned), so it's published to GitHub Packages (npm.pkg.github.com), the same registry and
# trigger convention as every other native module (e.g. booth-catalog's catalog-ui-v* tags).
on:
  push:
    tags:
      - "lakehouse-ui-v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@projectbooth"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, test (don't publish something CI hasn't verified)
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run
      - name: The tag must match package.json's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "lakehouse-ui-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

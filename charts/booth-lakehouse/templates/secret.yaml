{{- /*
Lakekeeper encrypts the storage credentials it holds with this key before writing them to its
Postgres (its default secret store). Generated once and kept across upgrades and uninstalls: losing
it makes the stored (short-lived, broker-issued) warehouse credentials unreadable until the next
renewal replaces them. Never mounted into the API pod.
*/ -}}
{{- $name := printf "%s-lakekeeper" (include "booth-lakehouse.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "booth-lakehouse.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "encryption-key") }}
  encryption-key: {{ index $existing.data "encryption-key" }}
  {{- else }}
  encryption-key: {{ randAlphaNum 48 | b64enc }}
  {{- end }}

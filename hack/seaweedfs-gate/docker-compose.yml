# ADR 0118 verification gate 2 and 3 (test tooling only, not part of the chart):
# Lakekeeper v0.13.6 against SeaweedFS 4.48 with a prefix-scoped IAM user key, minted the way
# booth-storage's seaweedfs provider will mint it (CreateUser, PutUserPolicy, CreateAccessKey).
#
#   docker compose -f hack/seaweedfs-gate/docker-compose.yml up -d --wait
#   docker compose -f hack/seaweedfs-gate/docker-compose.yml run --rm --build gate
#   docker compose -f hack/seaweedfs-gate/docker-compose.yml down -v
#
# Lakekeeper reaches SeaweedFS only through `s3log` (mitmproxy in reverse mode, Host header kept so
# SigV4 still verifies), which records every S3 request's checksum headers: that is how the gate sees
# whether Lakekeeper's Rust SDK sends aws-chunked trailer checksums and whether SeaweedFS accepts them.
x-lakekeeper-env: &lk-env
  LAKEKEEPER__PG_DATABASE_URL_READ: postgres://lakehouse:lakehouse-test@postgres:5432/booth_mod_lakehouse?sslmode=disable
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://lakehouse:lakehouse-test@postgres:5432/booth_mod_lakehouse?sslmode=disable
  LAKEKEEPER__PG_ENCRYPTION_KEY: local-test-encryption-key-not-a-secret
  LAKEKEEPER__BASE_URI: http://lakekeeper:8181
  LAKEKEEPER__TASK_POLL_INTERVAL: 1s # the purge task runs sooner; the work it does is unchanged

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse-test
      POSTGRES_DB: booth_mod_lakehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakehouse -d booth_mod_lakehouse"]
      interval: 2s
      timeout: 5s
      retries: 30

  seaweedfs:
    # 4.48 (ADR 0118), pinned by digest.
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # The embedded IAM API shares the S3 port. iam.json holds only the STS signing key, which the IAM
    # API needs even when STS isn't used (booth-storage spike b3c7863, section 1).
    command: >-
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.ip.bind=0.0.0.0
      -s3.iam -s3.iam.readOnly=false -s3.iam.config=/etc/seaweedfs/iam.json
    volumes: ["./iam.json:/etc/seaweedfs/iam.json:ro"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 2s
      timeout: 5s
      retries: 60

  seaweedfs-init:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # The server boots with no identities: seed the admin that booth-storage's provider would hold.
    entrypoint: ["sh", "-c", "echo 's3.configure -access_key gate-admin -secret_key gate-admin-secret-not-a-secret -user admin -actions Admin -apply' | weed shell -master=seaweedfs:9333"]
    depends_on:
      seaweedfs: { condition: service_healthy }

  s3log:
    image: mitmproxy/mitmproxy@sha256:0d7b2a14b4a71a908cd6f31b8f50e29bbc5c8720fe6caa706acf782da558e5c7 # 12.1.2
    # The image's entrypoint drops to an unprivileged user that can't write the shared log volume.
    entrypoint: ["mitmdump"]
    command: >-
      --mode reverse:http://seaweedfs:8333@8333 --set keep_host_header=true
      --set stream_large_bodies=1g -q -s /gate/s3log.py
    volumes: ["./s3log.py:/gate/s3log.py:ro", "s3log:/log"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1', 8333), 2)\""]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      seaweedfs: { condition: service_healthy }

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog@sha256:d6829722cac0d00dfc5665b0955766387b93ccadd8b1e70e679b49619bc30ea5 # v0.13.6
    command: ["migrate"]
    environment: *lk-env
    depends_on:
      postgres: { condition: service_healthy }

  lakekeeper:
    image: quay.io/lakekeeper/catalog@sha256:d6829722cac0d00dfc5665b0955766387b93ccadd8b1e70e679b49619bc30ea5 # v0.13.6
    command: ["serve"]
    environment: *lk-env
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      lakekeeper-migrate: { condition: service_completed_successfully }
      s3log: { condition: service_healthy }

  gate:
    profiles: ["gate"]
    build: { context: ../.., dockerfile: tests/integration/Dockerfile }
    command: ["python", "hack/seaweedfs-gate/gate.py"]
    volumes: ["./:/src/hack/seaweedfs-gate:ro", "s3log:/log:ro"]
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      S3_DIRECT: http://seaweedfs:8333
      S3_VIA_LOG: http://s3log:8333
      S3_ADMIN_KEY: gate-admin
      S3_ADMIN_SECRET: gate-admin-secret-not-a-secret
      S3_LOG: /log/s3.jsonl
    depends_on:
      lakekeeper: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }

volumes:
  s3log: {}

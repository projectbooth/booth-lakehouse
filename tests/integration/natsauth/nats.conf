# Test NATS server for hack/docker-compose.yml: JetStream plus the JWT operator/account trust
# booth-core generates (auth.conf, from core's own natsauth code — see gen.go). Same mode as a real
# deployment (ADR 0050): a connection without a valid credential is refused, and each credential
# may publish/subscribe only what core's GrantsFor derived from a manifest.
port: 4222
http: 8222
jetstream {
  store_dir: /data
}
include auth.conf
